# Ogni modifica su main va prima qui: progetto Supabase «messina-prova» e siti *-prova.
# Nessuna approvazione: è l'ambiente dove si prova. I dati veri non ci sono mai.
name: Prova
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: pubblica-prova
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  pubblica:
    # finché gli account non sono aperti non parte (niente mail di errore): si accende con la variabile
    # di repository MESSINA_ATTIVO = si (Settings → Secrets and variables → Actions → Variables)
    if: vars.MESSINA_ATTIVO == 'si'
    uses: ./.github/workflows/_pubblica.yml
    with:
      ambiente: prova
    secrets: inherit
