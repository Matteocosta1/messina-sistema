# Pubblicazione comune a Prova e Produzione: prima il database e le funzioni, poi i siti su Cloudflare Pages.
# Non parte da sola: la chiamano prova.yml (a ogni push su main) e produzione.yml (solo a mano, con approvazione).
#
# Ogni ambiente GitHub (Settings → Environments: «prova», «produzione») ha gli STESSI nomi, con i suoi valori:
#   Secrets:   SUPABASE_ACCESS_TOKEN, SUPABASE_DB_PASSWORD, SUPABASE_PROJECT_REF, CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
#   Variables: SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY (valori pubblici)
name: Pubblica
on:
  workflow_call:
    inputs:
      ambiente:
        type: string
        required: true
permissions:
  contents: read
jobs:
  supabase:
    runs-on: ubuntu-24.04
    environment: ${{ inputs.ambiente }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.48.3   # versione fissa: aggiornarla di proposito, non da sola
      - run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
      - name: Migrazioni del database
        run: supabase db push --include-all
      - name: Edge Functions
        run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
  siti:
    needs: supabase
    runs-on: ubuntu-24.04
    environment: ${{ inputs.ambiente }}
    strategy:
      matrix:
        include:
          - { app: gestionale, progetto: messina-gestionale-trasporti }
          - { app: gestionale, progetto: messina-gestionale-corporation }
          - { app: app,        progetto: messina-app }
          - { app: portale,    progetto: messina-portale }
          - { app: negozio,    progetto: messina-negozio }
          - { app: sito-trasporti,   progetto: messina-sito-trasporti }
          - { app: sito-corporation, progetto: messina-sito-corporation }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund --ignore-scripts
      - name: config.js con i valori pubblici
        env:
          URL: ${{ vars.SUPABASE_URL }}
          CHIAVE: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
          NEGOZIO: ${{ vars.URL_NEGOZIO }}
          PORTALE: ${{ vars.URL_PORTALE }}
          SITO_T: ${{ vars.URL_SITO_TRASPORTI }}
          SITO_C: ${{ vars.URL_SITO_CORPORATION }}
        run: |
          case "$CHIAVE" in sb_secret_*|*service_role*) echo "Questa è una chiave SEGRETA: qui va la publishable" && exit 1;; esac
          printf 'window.MESSINA = { supabaseUrl: %s, supabaseKey: %s, negozioUrl: %s, portaleUrl: %s, trasportiUrl: %s, corporationUrl: %s };\n' "\"$URL\"" "\"$CHIAVE\"" "\"$NEGOZIO\"" "\"$PORTALE\"" "\"$SITO_T\"" "\"$SITO_C\"" > apps/${{ matrix.app }}/config.js
          node apps/${{ matrix.app }}/build.mjs
      - name: Pubblica su Cloudflare Pages
        uses: cloudflare/wrangler-action@v3.14.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # in prova i progetti hanno il suffisso -prova (es. messina-app-prova)
          command: pages deploy apps/${{ matrix.app }}/dist --project-name=${{ matrix.progetto }}${{ inputs.ambiente == 'prova' && '-prova' || '' }} --branch=main
