# Copia notturna del database su Cloudflare R2, cifrata con age (oltre al PITR di Supabase).
# Si decifra solo con la chiave privata age, che NON sta su GitHub (Bitwarden + copia offline).
# Segreti (ambiente GitHub «backup», solo questi): SUPABASE_DB_URL (stringa di connessione «Session pooler»), R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, R2_ENDPOINT, R2_BUCKET
# Variabile: AGE_PUBLIC_KEY (pubblica, inizia con age1…)
name: Backup
on:
  schedule:
    - cron: "30 1 * * *"   # 3:30 di notte d'estate, 2:30 d'inverno (ora di Roma)
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backup:
    runs-on: ubuntu-24.04
    environment: backup   # ambiente senza approvazione: altrimenti la copia notturna aspetterebbe un sì ogni notte
    steps:
      - run: sudo apt-get update -q && sudo apt-get install -y -q age
      - name: pg_dump → age → R2
        env:
          DB: ${{ secrets.SUPABASE_DB_URL }}
          AGE: ${{ vars.AGE_PUBLIC_KEY }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          set -euo pipefail
          nome="messina-$(date -u +%Y-%m-%d).dump.age"
          docker run --rm -e DB postgres:17 sh -c 'pg_dump --format=custom --no-owner --no-privileges "$DB"' | age -r "$AGE" > "$nome"
          test "$(stat -c%s "$nome")" -gt 10000 || { echo "Copia troppo piccola: qualcosa non va"; exit 1; }
          aws s3 cp "$nome" "s3://$R2_BUCKET/$nome" --endpoint-url "$R2_ENDPOINT" --only-show-errors
          echo "Copia salvata: $nome"
